# Neopixel leds integrated in the Fysetc mini12864 display
[gcode_macro _USER_VARIABLES]
variable_status_leds_minidisplay_enabled = True
variable_status_leds_minidisplay_knob_only = False
variable_status_leds_minidisplay_led_name: "fysetc_mini12864"
gcode:

# Also include directly the leds control macros from here
[include ../../../macros/hardware_functions/status_leds.cfg]


[display]
lcd_type: uc1701
cs_pin: EXP1_5
a0_pin: EXP1_4
rst_pin: EXP1_3
encoder_pins: ^EXP1_10, ^EXP1_9
click_pin: ^!EXP1_6
## Some micro-controller boards may require an spi bus to be specified:
#spi_bus: spi
## Alternatively, some micro-controller boards may work with software spi:
contrast: 63
spi_software_miso_pin: MCU_SPI1_MISO
spi_software_mosi_pin: MCU_SPI1_MOSI
spi_software_sclk_pin: MCU_SPI1_SCK
encoder_steps_per_detent: 2

[pwm_cycle_time beeper]
pin: MCU_IO4
value: 0
shutdown_value: 0
cycle_time: 0.0005
scale: 1

[neopixel fysetc_mini12864]
pin: EXP1_8
chain_count: 3 # 1 = Screen, 2 = Encoder Left Top, 3 = Encoder Right Bottom
color_order: RGB
initial_RED: 0.05098039216 #0.0
initial_GREEN: 0.8 #0.2
initial_BLUE: 0.01960784314 #0.8

[delayed_gcode welcome1]
initial_duration: 1
gcode:
    M117 Hello!

[delayed_gcode welcome2]
initial_duration: 2.5
gcode:
    M117 Ready to make!


[delayed_gcode STARTUP_BEEP]
initial_duration: 1
gcode:
    M300 S1000
    M300 S2000
    M300 S3000

### M300  P2000 S2000 ####
[gcode_macro m300]
description: Emits an audible beep.
  Usage: M300 [P<duration>] [S<frequency>]
gcode:
  {% set settings = printer.configfile.settings %}
  {% if "output_pin beeper" in printer or "pwm_cycle_time beeper" in printer %}
    {% set P = (params.P|default(100)|int, 0)|max %}
    {% set S = (params.S|default(1000)|int, 0)|max %}
    {% if S == 0 %}
      G4 P{P}
    {% else %}
      SET_PIN PIN=beeper VALUE={% if "output_pin beeper" in settings %}1{%else%}{
          settings["pwm_cycle_time beeper"].scale|default(1.0) * 0.3
        } CYCLE_TIME={ 1.0 / S }
      G4 P{P}
      SET_PIN PIN=beeper VALUE=0
     {% endif %}

    {% endif %}
  {% else %}
    {action_respond_info(
       "M300 is disabled. To enable, create a [pwm_cycle_time beeper] config.")}
  {% endif %}

  #### Beep Macro ####
[gcode_macro BEEP]
gcode:
    # Parameters
    {% set i = params.I|default(1)|int %}           ; Iterations (number of times to beep).
    {% set dur = params.DUR|default(100)|int %}     ; Duration/wait of each beep in ms. Default 100ms.
    {% set freq = params.FREQ|default(2000)|int %}  ; Frequency in Hz. Default 2kHz.

    {% for iteration in range(i|int) %}
        {% if freq == 0 %}
          G4 P{dur}
        {% else %}
          SET_PIN PIN=beeper VALUE=0.5 CYCLE_TIME={ 1.0/freq }
          G4 P{dur}
          SET_PIN PIN=beeper VALUE=0
        {% endif %}
    {% endfor %}

[menu __main __octoprint]
type: disabled
